name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_SYSTEM_PYTHON: 1

jobs:
  # ── Gate 1: Lint & Format ─────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ── Gate 1b: Frontend build (Tailwind + esbuild) ────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS + JS
        run: npm run build

      - name: Assert build outputs exist and are non-empty
        run: |
          test -s static/assets/tailwind.css || { echo "::error::static/assets/tailwind.css missing or empty"; exit 1; }
          test -s static/assets/app.js || { echo "::error::static/assets/app.js missing or empty"; exit 1; }
          echo "tailwind.css: $(wc -c < static/assets/tailwind.css) bytes"
          echo "app.js:       $(wc -c < static/assets/app.js) bytes"

  # ── Gate 2: Type Check (informational until pre-existing errors are resolved) ─
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Mypy
        run: mypy app/
        continue-on-error: true

  # ── Gate 3: Test ─────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scenesentry
          POSTGRES_PASSWORD: scenesentry
          POSTGRES_DB: scenesentry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenesentry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "sqlite:///test.db"
      TEST_DATABASE_URL: "postgresql://scenesentry:scenesentry@localhost:5432/scenesentry_test"
      SECRET_KEY: "ci-test-key"
      ENV: "development"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Gate 4: Security Audit ───────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: pip-audit
        run: pip-audit --strict --desc
        continue-on-error: true
