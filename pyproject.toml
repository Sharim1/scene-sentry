[project]
name = "moviemind"
version = "2.0.0"
description = "AI-powered entertainment discovery and gossip platform"
requires-python = ">=3.11"
dependencies = [
    # FastAPI and web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.20",
    "starlette-session>=0.4.0",
    "itsdangerous>=2.2.0",
    
    # Database
    "sqlalchemy>=2.0.43",
    "psycopg2-binary>=2.9.10",
    
    # Pydantic
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    
    # Auth
    "werkzeug>=3.1.3",
    "clerk-backend-api>=1.0.0",
    "svix>=1.41.0",
    
    # Rate limiting
    "slowapi>=0.1.9",
    
    # AI and LangChain
    "langchain>=0.3.27",
    "langchain-core>=0.3.75",
    "langchain-google-genai>=2.1.10",
    "langchain-community>=0.3.29",
    "langchain-tavily>=0.2.11",
    "langgraph>=0.6.6",
    "langgraph-checkpoint>=2.1.1",
    "google-genai>=1.33.0",
    "google-generativeai>=0.8.0",
    "google-api-core>=2.20.0",
    "protobuf>=5.28.0",
    "grpcio>=1.68.0",
    "tavily-python>=0.7.11",
    
    # HTTP and scraping
    "httpx>=0.28.0",
    "requests>=2.32.5",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    
    # Background tasks
    "apscheduler>=3.11.0",
    
    # Utilities
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
