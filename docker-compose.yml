services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scenesentry
      POSTGRES_PASSWORD: scenesentry
      POSTGRES_DB: scenesentry
    ports:
      # 5433 avoids clashing with a local Homebrew Postgres on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenesentry"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  worker:
    build: .
    image: scene-sentry:local
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  # Exactly ONE beat instance — the schedule is a singleton. Never scale this
  # service (`docker compose up --scale beat=N` would double-fire every job).
  beat:
    build: .
    image: scene-sentry:local
    command: celery -A app.celery_app beat --loglevel=info --schedule=/data/celerybeat-schedule
    env_file: .env
    restart: unless-stopped
    volumes:
      - beat_schedule:/data
    depends_on:
      worker:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  beat_schedule:
