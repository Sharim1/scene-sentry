# Alembic configuration for Scene Sentry.
#
# The database URL is NOT set here on purpose — env.py pulls it from the
# application settings (app.config.settings.database_url) so there is a single
# source of truth shared with the running app.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS-native path separators and a UTC, sortable timestamp + slug for new
# revision filenames (e.g. 2026_06_21_1430-ab12cd34ef56_add_foo.py).
path_separator = os
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Auto-format generated migrations with ruff to match project style.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ── Logging ───────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
